# The iOS app's Xcode project, generated with XcodeGen: cd iosApp && xcodegen
# The tracking code comes from the shared Kotlin module, built by Gradle as part of each Xcode build.
name: GolfBallTracer
options:
  bundleIdPrefix: com.golftracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GolfBallTracer:
    type: application
    platform: iOS
    sources: [GolfBallTracer]
    info:
      path: GolfBallTracer/Info.plist
      properties:
        CFBundleDisplayName: GolfBallTracer
        CFBundleShortVersionString: "0.1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Recordings can be copied in with the Files app or Finder, or opened from another app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GolfBallTracer recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.golftracker.ios
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "GolfTracking"]
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_STYLE: Automatic
        # Set to the development team once its Apple ID is added in Xcode › Settings › Accounts.
        DEVELOPMENT_TEAM: ""
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
