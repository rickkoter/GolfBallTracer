# The iOS app's Xcode project, generated with XcodeGen: cd iosApp && xcodegen
# The tracking code comes from the shared Kotlin module, built by Gradle as part of each Xcode build.
name: GolfBallTracer
options:
  bundleIdPrefix: com.koterapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GolfBallTracer:
    type: application
    platform: iOS
    sources: [GolfBallTracer]
    info:
      path: GolfBallTracer/Info.plist
      properties:
        CFBundleDisplayName: GolfBallTracer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Filmed upright, as on Android: the tracker crops and turns frames for a portrait screen.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: GolfBallTracer films your shot to find the ball leaving the tee and trace its flight.
        NSMicrophoneUsageDescription: GolfBallTracer listens for the sound of the club striking the ball, to know when a shot starts.
        NSLocationWhenInUseUsageDescription: GolfBallTracer uses GPS to measure your shots and point you to where the ball landed.
        NSPhotoLibraryAddUsageDescription: GolfBallTracer saves shot videos with the tracer drawn in to your photos.
        # Only Apple's own encryption (HTTPS and the like) is used, so TestFlight needs no export paperwork.
        ITSAppUsesNonExemptEncryption: false
        # Recordings can be copied in with the Files app or Finder, or opened from another app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GolfBallTracer recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koterapps.golfballtracer
        # The version testers see, and the build number, which must go up with every TestFlight upload.
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "GolfTracking"]
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # The shared Kotlin framework is built for Apple silicon simulators only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        # The team that signs builds: for a connected iPhone or iPad, and for TestFlight (the paid Apple Developer
        # Program; joining kept the personal team's ID).
        DEVELOPMENT_TEAM: 5TLF4X4DA2
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  GolfBallTracer:
    build:
      targets:
        GolfBallTracer: all
    # Run in Release: the shared tracking code is then built optimised, and unoptimised it can't keep
    # up with the camera. Archives (for TestFlight) are Release too.
    run:
      config: Release
    archive:
      config: Release
